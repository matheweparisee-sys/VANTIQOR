services:
  - type: web
    name: vantiqor
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/system/health
    disk:
      name: vantiqor-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: ADMIN_API_KEY
        sync: false
